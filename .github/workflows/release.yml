name: Release Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  PRODUCTION_SITE_URL: https://apexomnihub.icu

jobs:
  release:
    name: Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install ruff (Python linter)
        run: |-
          pip install "ruff==0.15.16" --only-binary=':all:' --quiet --disable-pip-version-check
      - name: Install orchestrator Python test deps (pytest gate)
        # verify:release -> verify:test -> test:py runs `cd orchestrator && pytest`.
        # Without these deps pytest is absent and the whole release suite aborts
        # before the shadow preflight, leaving release evidence uncertifiable.
        run: pip install -r orchestrator/requirements.txt --quiet --disable-pip-version-check
      - name: Run CI integrity scanner
        run: bun run verify:ci-integrity
      - name: Run Release verification suite
        # Supabase build vars required so check-env-root.mjs does not fail closed.
        # The guard blocks APEX_ALLOW_MISSING_SUPABASE_CONFIG=true in CI (isCiOrProduction=true),
        # so the actual secrets must be present for verify:build (Vite compilation).
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run verify:release
      - name: Detect release cut
        id: release_signal
        run: |
          if git log -1 --format="%s" | grep -qF "chore: version packages"; then
            echo "release_cut=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_cut=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Shadow validation preflight
        id: shadow_preflight
        env:
          ENABLE_SHADOW_DEPLOYMENT: ${{ vars.ENABLE_SHADOW_DEPLOYMENT }}
          ENABLE_ATOMIC_ROUTING_FLIP: ${{ vars.ENABLE_ATOMIC_ROUTING_FLIP }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SHADOW_PROJECT_NAME: ${{ vars.CLOUDFLARE_SHADOW_PROJECT_NAME }}
          SHADOW_HEALTH_URL: ${{ vars.SHADOW_HEALTH_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TF_PROD_TOKEN: ${{ secrets.TF_PROD_TOKEN }}
        run: node scripts/ci/shadow-certification-preflight.mjs
      - name: Deploy to Shadow Slot (Cloudflare Pages)
        if: |
          steps.release_signal.outputs.release_cut == 'true' && steps.shadow_preflight.outputs.status == 'pass'
        id: shadow_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_SHADOW_PROJECT_NAME: ${{ vars.CLOUDFLARE_SHADOW_PROJECT_NAME }}
          VITE_SITE_URL: ${{ env.PRODUCTION_SITE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CONNECT_AI_ENABLED: 'true'
          # Build-time orchestrator URL — inlined by Vite into the shadow bundle.
          # Direct (`wrangler pages deploy`) uploads do NOT read CF Pages
          # dashboard vars, so supply it here. Override via repo Variable
          # VITE_ORCHESTRATOR_URL; falls back to the public orchestrator API.
          VITE_ORCHESTRATOR_URL: ${{ vars.VITE_ORCHESTRATOR_URL || 'https://apex-orchestrator-api.onrender.com' }}
        run: |
          echo "Building frontend for shadow deployment..."
          bun run build
          npm run check:pwa
          echo "Deploying to Cloudflare Pages shadow slot: ${CF_SHADOW_PROJECT_NAME}"
          npx --yes --ignore-scripts wrangler@latest pages deploy dist \
            --project-name="${CF_SHADOW_PROJECT_NAME}" \
            --commit-dirty=true \
            2>&1 | tee shadow-deploy.log
          SHADOW_URL=$(grep -oP 'https://[^\s]+\.pages\.dev' shadow-deploy.log | head -1 || echo "")
          echo "shadow_url=${SHADOW_URL}" >> "$GITHUB_OUTPUT"
          echo "Shadow deployment URL: ${SHADOW_URL}"
      - name: Shadow Health Check
        if: steps.shadow_deploy.outputs.shadow_url != ''
        id: shadow_health
        env:
          SHADOW_URL: ${{ steps.shadow_deploy.outputs.shadow_url }}
        run: |
          echo "Polling ${SHADOW_URL}/health ..."
          MAX_ATTEMPTS=10
          WAIT=10
          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${SHADOW_URL}/health" || echo "000")
            echo "Attempt $i/${MAX_ATTEMPTS}: HTTP ${HTTP_STATUS}"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "health_result=pass" >> "$GITHUB_OUTPUT"
              echo "Shadow health: PASS"
              exit 0
            fi
            sleep $WAIT
          done
          echo "health_result=fail" >> "$GITHUB_OUTPUT"
          echo "::error::Shadow health check failed after ${MAX_ATTEMPTS} attempts."
          exit 1
      - name: Deterministic Validator CI Gate
        if: steps.shadow_health.outputs.health_result == 'pass'
        id: validator
        run: |
          node integration-harness/lib/deterministic-validator.mjs
          echo "validator_result=pass" >> "$GITHUB_OUTPUT"
        env:
          TARGET_URL: ${{ steps.shadow_deploy.outputs.shadow_url }}
      - name: Skip shadow deployment — validation preflight blocked
        if: |
          steps.release_signal.outputs.release_cut == 'true' && steps.shadow_preflight.outputs.status != 'pass'
        run: |
          echo "Skipping shadow deployment because validation preflight is blocked."
          cat shadow-preflight.json
          echo "See docs/release/SHADOW_DEPLOYMENT_BLOCKERS.md for requirements."
      - name: Terraform Plan (shadow validated)
        if: |
          steps.release_signal.outputs.release_cut == 'true' && vars.ENABLE_SHADOW_DEPLOYMENT == 'true' && vars.ENABLE_ATOMIC_ROUTING_FLIP == 'true' && steps.validator.outputs.validator_result == 'pass'
        id: tf_plan
        run: |
          cd terraform/environments/production
          terraform init -input=false
          terraform plan -input=false -out=tfplan -var="target_slot=production-shadow"
          echo "tf_plan_result=pass" >> "$GITHUB_OUTPUT"
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_PROD_TOKEN }}
      - name: Upload Terraform plan artifact
        if: steps.tf_plan.outputs.tf_plan_result == 'pass'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan
          path: terraform/environments/production/tfplan
          retention-days: 1
      - name: Skip atomic routing flip — prerequisites not met
        if: |
          steps.release_signal.outputs.release_cut == 'true' && (vars.ENABLE_SHADOW_DEPLOYMENT != 'true' || vars.ENABLE_ATOMIC_ROUTING_FLIP != 'true')
        env:
          SHADOW_ENABLED: ${{ vars.ENABLE_SHADOW_DEPLOYMENT }}
          ROUTING_FLIP_ENABLED: ${{ vars.ENABLE_ATOMIC_ROUTING_FLIP }}
        run: |
          echo "Skipping routing flip."
          echo "ENABLE_SHADOW_DEPLOYMENT=${SHADOW_ENABLED}"
          echo "ENABLE_ATOMIC_ROUTING_FLIP=${ROUTING_FLIP_ENABLED}"
      - name: Write pre-apply validation summary
        if: always()
        env:
          GH_SHA: ${{ github.sha }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          SHADOW_URL_RAW: ${{ steps.shadow_deploy.outputs.shadow_url || '' }}
          HEALTH_RAW: ${{ steps.shadow_health.outputs.health_result || 'skipped' }}
          VALIDATOR_RAW: ${{ steps.validator.outputs.validator_result || 'skipped' }}
          TF_PLAN_RESULT_RAW: ${{ steps.tf_plan.outputs.tf_plan_result || 'skipped' }}
          TF_PLAN_OUTCOME_RAW: ${{ steps.tf_plan.outcome || 'skipped' }}
          TF_APPLY_RESULT_RAW: 'pending'
          TF_APPLY_OUTCOME_RAW: 'pending'
          PUBLISHED_RAW: 'false'
          RELEASE_CUT_RAW: ${{ steps.release_signal.outputs.release_cut || 'false' }}
        run: node scripts/ci/write-release-validation-summary.mjs
      - name: Upload release-validation summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pre-apply-release-validation-summary
          path: |
            release-validation-summary.json
            shadow-preflight.json
          retention-days: 90
      - name: Block enabled shadow release when validation preflight fails
        if: |
          steps.release_signal.outputs.release_cut == 'true' && vars.ENABLE_SHADOW_DEPLOYMENT == 'true' && steps.shadow_preflight.outputs.status != 'pass'
        run: |
          echo "::error::Shadow deployment was enabled, but validation preflight is blocked."
          cat release-validation-summary.json
          exit 1
    outputs:
      tf_plan_result: ${{ steps.tf_plan.outputs.tf_plan_result }}
      shadow_url: ${{ steps.shadow_deploy.outputs.shadow_url }}
      health_result: ${{ steps.shadow_health.outputs.health_result }}
      validator_result: ${{ steps.validator.outputs.validator_result }}

  atomic-routing-flip:
    name: Atomic Routing Flip (Promote to Active)
    needs: [release]
    if: needs.release.outputs.tf_plan_result == 'pass'
    runs-on: ubuntu-22.04
    environment: production-shadow
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Download Terraform plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan
          path: terraform/environments/production
      - name: Download pre-apply evidence artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pre-apply-release-validation-summary
          path: pre-apply-evidence
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_PROD_TOKEN }}
      - name: Terraform Init
        run: |
          cd terraform/environments/production
          terraform init -input=false
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_PROD_TOKEN }}
      - name: Terraform Apply - Promote Shadow to Active
        run: |
          echo "Executing Terraform apply with plan artifact..."
          cd terraform/environments/production
          terraform apply -input=false tfplan
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_PROD_TOKEN }}

      - name: Write final validation summary (apply failed)
        if: failure()
        env:
          GH_SHA: ${{ github.sha }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          SHADOW_URL_RAW: ${{ needs.release.outputs.shadow_url }}
          HEALTH_RAW: ${{ needs.release.outputs.health_result }}
          VALIDATOR_RAW: ${{ needs.release.outputs.validator_result }}
          TF_PLAN_RESULT_RAW: ${{ needs.release.outputs.tf_plan_result }}
          TF_PLAN_OUTCOME_RAW: 'success'
          TF_APPLY_RESULT_RAW: 'fail'
          TF_APPLY_OUTCOME_RAW: 'failure'
          PUBLISHED_RAW: 'false'
          RELEASE_CUT_RAW: 'true'
          PREFLIGHT_OUTPUT_PATH: pre-apply-evidence/shadow-preflight.json
        run: node scripts/ci/write-release-validation-summary.mjs
      - name: Write final validation summary
        if: success()
        env:
          GH_SHA: ${{ github.sha }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          SHADOW_URL_RAW: ${{ needs.release.outputs.shadow_url }}
          HEALTH_RAW: ${{ needs.release.outputs.health_result }}
          VALIDATOR_RAW: ${{ needs.release.outputs.validator_result }}
          TF_PLAN_RESULT_RAW: ${{ needs.release.outputs.tf_plan_result }}
          TF_PLAN_OUTCOME_RAW: 'success'
          TF_APPLY_RESULT_RAW: 'pass'
          TF_APPLY_OUTCOME_RAW: 'success'
          PUBLISHED_RAW: 'true'
          RELEASE_CUT_RAW: 'true'
          PREFLIGHT_OUTPUT_PATH: pre-apply-evidence/shadow-preflight.json
        run: node scripts/ci/write-release-validation-summary.mjs
      - name: Upload final release-validation summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-release-validation-summary
          path: release-validation-summary.json
          retention-days: 90
