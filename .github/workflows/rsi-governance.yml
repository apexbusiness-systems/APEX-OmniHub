name: "RSI Governance Gate"

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rsi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rsi-governance:
    name: "RSI Governance Gate"
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install RSI dependencies
        run: "pip install --only-binary :all: --require-hashes -r tools/rsi/requirements.txt"

      - name: Create artifact directories
        run: |
          mkdir -p artifacts/rsi
          mkdir -p inventory

      - name: Generate repository inventory
        run: bash scripts/repo_inventory.sh > inventory/repo-inventory.txt

      - name: Build RSI evidence bundle
        run: python3 tools/rsi/build_evidence.py --ci
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Run RSI policy engine (deterministic)
        run: python3 tools/rsi/policy_engine.py

      - name: Run RSI model advisory (conditional)
        if: ${{ env.RSI_MODEL_ENABLED != '' }}
        run: python3 tools/rsi/model_gateway.py
        env:
          RSI_MODEL_ENABLED: ${{ secrets.RSI_MODEL_ENABLED }}
          RSI_MODEL_ENDPOINT: ${{ secrets.RSI_MODEL_ENDPOINT }}
          RSI_MODEL_API_KEY: ${{ secrets.RSI_MODEL_API_KEY }}

      - name: Combine evidence into final decision
        run: python3 tools/rsi/decision.py
        env:
          RSI_MODEL_ENABLED: ${{ secrets.RSI_MODEL_ENABLED }}

      - name: Validate decision.json schema
        run: |
          python3 - <<'PYEOF'
          import json, sys
          d = json.load(open("artifacts/rsi/decision.json"))
          required = [
            "decision","risk","abort","protected_path_hits","changed_paths",
            "required_tests","recommended_reviewers","rationale",
            "policy_version","deterministic_summary","model_summary","artifacts_generated"
          ]
          missing = [k for k in required if k not in d]
          if missing:
              print(f"SCHEMA ERROR: missing keys: {missing}", file=sys.stderr)
              sys.exit(1)
          if d["decision"] not in ("allow","escalate","block"):
              print(f"SCHEMA ERROR: invalid decision value: {d['decision']}", file=sys.stderr)
              sys.exit(1)
          if not isinstance(d["abort"], bool):
              print("SCHEMA ERROR: abort must be bool", file=sys.stderr)
              sys.exit(1)
          print(f"decision.json valid: decision={d['decision']} risk={d['risk']} abort={d['abort']}")
          PYEOF

      - name: Upload RSI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rsi-governance-artifacts
          path: |
            artifacts/rsi/evidence.json
            artifacts/rsi/policy_result.json
            artifacts/rsi/model_result.json
            artifacts/rsi/decision.json
            inventory/repo-inventory.txt
          retention-days: 30

      - name: Fail pipeline on RSI block
        run: |
          ABORT=$(python3 -c "import json; d=json.load(open('artifacts/rsi/decision.json')); print(str(d['abort']).lower())")
          DECISION=$(python3 -c "import json; d=json.load(open('artifacts/rsi/decision.json')); print(d['decision'])")
          RATIONALE=$(python3 -c "import json; d=json.load(open('artifacts/rsi/decision.json')); print(d['rationale'])")
          echo "RSI decision: $DECISION | abort: $ABORT"
          echo "Rationale: $RATIONALE"
          # Fail on abort:true (block).
          # escalate means the policy engine cannot auto-allow — a human must review before merge, but we do not exit 1 to prevent deadlocks.
          if [ "$ABORT" = "true" ]; then
            echo "::error title=RSI Governance Block::$RATIONALE"
            echo "::error title=RSI Governance Block::decision=$DECISION abort=$ABORT — merge blocked until human review clears escalation."
            exit 1
          fi
          if [ "$DECISION" = "escalate" ]; then
            echo "::warning title=RSI Governance Escalation::$RATIONALE"
            echo "::warning title=RSI Governance Escalation::decision=$DECISION abort=$ABORT — human review required, but merge is not hard-blocked by this pipeline to prevent deadlocks."
          fi
