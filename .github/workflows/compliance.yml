name: compliance

on:
  pull_request:
  push:
    branches:
      - main
      - release/*

env:
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '15000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '60000'
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  # Consolidated from four single-step micro-jobs (legal-drift-gate,
  # retention-evidence-gate, claims-proof-gate, rls-posture-gate). Each previously
  # span up its own runner + checkout + Node setup to run one script; they now run
  # sequentially in a single job, cutting four runner spin-ups to one.
  compliance-gates:
    name: Compliance Gates
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Legal drift gate
        run: node scripts/compliance/check_legal_drift.mjs

      - name: Retention evidence gate
        run: |
          node scripts/compliance/generate_retention_evidence.mjs
          node scripts/compliance/check_retention_consistency.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retention-evidence
          path: build-artifacts/retention-evidence.json

      - name: Claims proof gate
        run: node scripts/compliance/check_claims_proof.mjs

      - name: RLS posture gate
        run: bash scripts/security/check_rls_posture.sh

  sbom-gate:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-22.04
    env:
      npm_package_version: ""
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: mkdir -p build-artifacts
      - run: bunx @cyclonedx/cdxgen -t node --no-validate -o build-artifacts/sbom-npm.cdx.json
      - run: pip install cyclonedx-bom
      - run: cyclonedx-py environment --output-format JSON --output-file build-artifacts/sbom-python.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-artifacts
          path: |
            build-artifacts/sbom-npm.cdx.json
            build-artifacts/sbom-python.cdx.json
      - name: Get package version
        run: echo "npm_package_version=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      # Release cuts are MANUAL / owner-driven. This SBOM step attaches evidence to a
      # release the owner has already cut; it must NEVER create a tag. We therefore gate
      # softprops/action-gh-release (which creates a missing tag by default) on the tag
      # already existing. CI validates; owner certifies.
      - name: Check release tag exists (attach-only; never create)
        id: tagcheck
        if: github.ref == 'refs/heads/main'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${npm_package_version}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No tag v${npm_package_version} yet — skipping SBOM attach. Release cuts are manual (owner-driven); CI validates, owner certifies."
          fi
      - name: Attach SBOM to GitHub Release (attach-only; existing tag)
        if: github.ref == 'refs/heads/main' && steps.tagcheck.outputs.exists == 'true'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: v${{ env.npm_package_version }}
          files: |
            build-artifacts/sbom-npm.cdx.json
            build-artifacts/sbom-python.cdx.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud-gate:
    permissions:
      contents: read
    env:
      SONAR_PROJECT_KEY: ${{ vars['SONAR_PROJECT_KEY'] }}
    if: vars['SONAR_PROJECT_KEY'] != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
      - run: |
          npx sonar-scanner \
            -Dproject.settings=sonar-project.properties \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=apexbusiness-systems \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.qualitygate.wait=true
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Fail on new critical/blocker issues
        if: env.SONAR_TOKEN != ''
        run: |
          if grep -q '"severity":"CRITICAL"\|"severity":"BLOCKER"' \
            .scannerwork/report-task.txt 2>/dev/null; then
            echo "BLOCKER or CRITICAL Sonar findings detected. Fix before merge."
            exit 1
          fi

  ruff-gate:
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check orchestrator
      - run: ruff format --check orchestrator
