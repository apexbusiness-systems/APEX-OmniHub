# CONTINUOUS DEPLOYMENT - STAGING
# Automatically deploys to staging on merge to main

name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual trigger

env:
  NODE_VERSION: "24.x"

jobs:
  terraform:
    name: Terraform Apply (Staging)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: terraform/environments/staging
    env:
      HAS_TF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.TF_API_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.6.0
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        if: ${{ env.HAS_TF_SECRETS == 'true' }}
        run: terraform init

      - name: Terraform Validate
        if: ${{ env.HAS_TF_SECRETS == 'true' }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        if: ${{ env.HAS_TF_SECRETS == 'true' }}
        run: terraform plan -out=tfplan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_upstash_email: ${{ secrets.UPSTASH_EMAIL }}
          TF_VAR_upstash_api_key: ${{ secrets.UPSTASH_API_KEY }}
          TF_VAR_github_repo: ${{ github.repository }}
          TF_VAR_vite_supabase_url: ${{ secrets.STAGING_SUPABASE_URL }}
          TF_VAR_vite_supabase_publishable_key: ${{ secrets.STAGING_SUPABASE_KEY }}
          TF_VAR_vite_sentry_dsn: ${{ secrets.SENTRY_DSN }}
          TF_VAR_vite_datadog_application_id: ${{ secrets.DATADOG_APP_ID }}
          TF_VAR_vite_datadog_client_token: ${{ secrets.DATADOG_CLIENT_TOKEN }}

      - name: Terraform Apply
        if: ${{ github.ref == 'refs/heads/main' && env.HAS_TF_SECRETS == 'true' }}
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_upstash_email: ${{ secrets.UPSTASH_EMAIL }}
          TF_VAR_upstash_api_key: ${{ secrets.UPSTASH_API_KEY }}
          TF_VAR_github_repo: ${{ github.repository }}
          TF_VAR_vite_supabase_url: ${{ secrets.STAGING_SUPABASE_URL }}
          TF_VAR_vite_supabase_publishable_key: ${{ secrets.STAGING_SUPABASE_KEY }}
          TF_VAR_vite_sentry_dsn: ${{ secrets.SENTRY_DSN }}
          TF_VAR_vite_datadog_application_id: ${{ secrets.DATADOG_APP_ID }}
          TF_VAR_vite_datadog_client_token: ${{ secrets.DATADOG_CLIENT_TOKEN }}

      - name: Terraform Status
        if: always()
        run: |
          echo "## 📋 Terraform Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.HAS_TF_SECRETS }}" != "true" ]; then
            echo "⚠️ **Using mock values** - Add real API tokens to GitHub Secrets" >> $GITHUB_STEP_SUMMARY
            echo "- CLOUDFLARE_API_TOKEN" >> $GITHUB_STEP_SUMMARY
            echo "- CLOUDFLARE_ZONE_ID" >> $GITHUB_STEP_SUMMARY
            echo "- UPSTASH_EMAIL" >> $GITHUB_STEP_SUMMARY
            echo "- UPSTASH_API_KEY" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Using real API tokens**" >> $GITHUB_STEP_SUMMARY
          fi

  build-and-deploy:
    name: Build and Deploy (Staging)
    runs-on: ubuntu-22.04
    needs: terraform
    if: always() # Run even if terraform fails
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Run tests
        run: bun run test:unit

      - name: Build application
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_DATADOG_APPLICATION_ID: ${{ secrets.DATADOG_APP_ID }}
          VITE_DATADOG_CLIENT_TOKEN: ${{ secrets.DATADOG_CLIENT_TOKEN }}
          VITE_CONNECT_AI_ENABLED: 'true'

      - name: Deployment Status
        if: always()
        run: |
          echo "## 🚀 Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ Deployment handled by Terraform/Cloudflare configuration." >> $GITHUB_STEP_SUMMARY

  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-22.04
    needs: build-and-deploy
    if: always() # Run even if deploy fails (for status reporting)
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Wait for deployment
        run: sleep 30 # Wait for staging deployment to stabilize

      - name: Run smoke tests
        run: bun run test:e2e
        continue-on-error: true
        env:
          STAGING_URL: https://staging.omnihub.dev

      - name: Health check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://staging.omnihub.dev/health)
          if [ $response -ne 200 ]; then
            echo "Health check failed with status $response"
            exit 1
          fi
          echo "Health check passed (200 OK)"
        continue-on-error: true

      - name: Validate /metrics endpoint
        run: |
          response=$(curl -sf https://staging.omnihub.dev/metrics 2>/dev/null || echo "UNREACHABLE")
          if [ "$response" = "UNREACHABLE" ]; then
            echo "⚠️ Metrics endpoint unreachable (expected if orchestrator not co-deployed)"
          elif echo "$response" | grep -q "idempotency_hits_total"; then
            echo "✅ /metrics endpoint operational — idempotency counters present"
          else
            echo "❌ /metrics returned unexpected payload"
            exit 1
          fi
        continue-on-error: true

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-22.04
    needs: [terraform, build-and-deploy, smoke-tests]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Staging Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Staging URL:** https://staging.omnihub.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.smoke-tests.result }}" == "success" ]; then
            echo "✅ **Status:** Deployment successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Deployment failed" >> $GITHUB_STEP_SUMMARY
          fi
