name: integration-harness
on:
  push:
    branches: [main, work, develop]
jobs:
  run:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout SBBL-HQ sibling repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone "https://x-access-token:${GH_PAT}@github.com/apexbusiness-systems/sbbl-hq.git" ../sbbl-hq

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install OmniHub deps
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install SBBL-HQ deps
        run: cd ../sbbl-hq && bun install --frozen-lockfile

      - name: Install harness deps
        run: cd integration-harness && bun install --frozen-lockfile

      # Resolve the exact installed Playwright version for a stable cache key.
      # Using the lockfile hash caused perpetual cache misses when Dependabot
      # bumped any harness dependency — even non-Playwright ones.
      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./integration-harness/node_modules/@playwright/test/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Cache the browser binary keyed to exact Playwright version + OS.
      # restore-keys provides a warm fallback when the version advances (rare).
      # On cache-hit the browser install step below is skipped entirely.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      # System libs are not cached — fast (~30 s via apt), required on every run.
      - name: Install Playwright system deps
        timeout-minutes: 3
        run: cd integration-harness && npx --no -- playwright install-deps chromium

      # Use the runner's preinstalled Google Chrome instead of downloading the
      # bundled Playwright Chromium binary. The bundled binary download reliably
      # stalls during zip extraction on GitHub-hosted runners after reaching 100%
      # (root-caused: ~170 MiB zip extraction on runner disk exceeds timeout).
      # This mirrors the fix already applied in ci-runtime-gates.yml.
      # Fallback to Playwright-managed chromium only when system Chrome is absent.
      - name: Install browser (chrome preferred, chromium fallback)
        timeout-minutes: 5
        run: |
          if command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1; then
            echo "System Google Chrome found — skipping binary download."
            google-chrome --version 2>/dev/null || google-chrome-stable --version
          else
            echo "System Chrome not found — installing Playwright Chromium (cache miss path)."
            cd integration-harness && npx --no -- playwright install chromium
          fi

      - name: Run harness
        run: cd integration-harness && bash run.sh
        env:
          OMNIHUB_REPO: ${{ github.workspace }}
          SBBL_REPO: ${{ github.workspace }}/../sbbl-hq
          GH_PAT: ${{ secrets.GH_PAT }}
          SBBL_SUPABASE_URL: ${{ secrets.SBBL_SUPABASE_URL }}
          SBBL_SUPABASE_ANON_KEY: ${{ secrets.SBBL_SUPABASE_ANON_KEY }}
          SBBL_SUPABASE_SERVICE_KEY: ${{ secrets.SBBL_SUPABASE_SERVICE_KEY }}
          OMNIHUB_SUPABASE_URL: ${{ secrets.OMNIHUB_SUPABASE_URL }}
          OMNIHUB_SUPABASE_ANON_KEY: ${{ secrets.OMNIHUB_SUPABASE_ANON_KEY }}
          INTEGRATION_ADMIN_EMAIL: ${{ secrets.INTEGRATION_ADMIN_EMAIL }}
          INTEGRATION_ADMIN_PASSWORD: ${{ secrets.INTEGRATION_ADMIN_PASSWORD }}
          INTEGRATION_FAN_EMAIL: ${{ secrets.INTEGRATION_FAN_EMAIL }}
          INTEGRATION_FAN_PASSWORD: ${{ secrets.INTEGRATION_FAN_PASSWORD }}
          INTEGRATION_PPV_ACCESS_CODE: ${{ secrets.INTEGRATION_PPV_ACCESS_CODE }}
          INTEGRATION_PPV_GAME_ID: ${{ secrets.INTEGRATION_PPV_GAME_ID }}
          SERVICE_BOOT_TIMEOUT: "120000"

      - name: Upload Playwright Report & Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            integration-harness/playwright-report/
            integration-harness/playwright-results/
          if-no-files-found: ignore
