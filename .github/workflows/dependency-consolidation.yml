name: dependency-consolidation

# BETA-T2: Weekly schedule — Sunday midnight UTC
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  consolidate-dependencies:
    runs-on: ubuntu-22.04
    # BETA-T3: Only process PRs with "dependencies" label
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Find open dependency PRs
        id: find-prs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'created',
              direction: 'asc'
            });

            const depPRs = prs.filter(pr =>
              pr.labels.some(label => label.name === 'dependencies')
            );

            if (depPRs.length === 0) {
              core.info('No open dependency PRs found. Exiting.');
              core.setOutput('has_prs', 'false');
              return;
            }

            core.setOutput('has_prs', 'true');
            core.setOutput('pr_numbers', JSON.stringify(depPRs.map(pr => pr.number)));
            core.setOutput('pr_count', depPRs.length.toString());

            for (const pr of depPRs) {
              core.info(`Found dependency PR #${pr.number}: ${pr.title}`);
            }

      - name: Update dependency PR branches only
        if: steps.find-prs.outputs.has_prs == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prNumbers = JSON.parse('${{ steps.find-prs.outputs.pr_numbers }}');

            for (const prNumber of prNumbers) {
              try {
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber
                });

                core.info(`Updated dependency PR #${prNumber}. Merge remains gated by required checks and branch protection.`);
              } catch (error) {
                core.warning(`Failed to update PR #${prNumber}: ${error.message}`);
              }
            }

      - name: Summary
        if: steps.find-prs.outputs.has_prs == 'true'
        run: |
          echo "## Dependency Consolidation Report" >> $GITHUB_STEP_SUMMARY
          echo "- PRs processed: ${{ steps.find-prs.outputs.pr_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- PR numbers: ${{ steps.find-prs.outputs.pr_numbers }}" >> $GITHUB_STEP_SUMMARY
          echo "- merge policy: branch-update only; required checks and branch protection remain authoritative" >> $GITHUB_STEP_SUMMARY
          echo "- update_branch: true" >> $GITHUB_STEP_SUMMARY
