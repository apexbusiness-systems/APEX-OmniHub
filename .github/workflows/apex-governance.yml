name: apex-governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel stale runs on the same PR/branch.
concurrency:
  group: apex-governance-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# No workflow-level permissions — each job declares only what it needs.
permissions: {}

jobs:
  apex-policy:
    name: APEX policy gates
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run APEX policy check
        # Fail-closed: no continue-on-error — policy failures must block the gate.
        run: |
          changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || git diff --name-only HEAD~1 HEAD)
          if [ -n "$changed_files" ]; then
            python governance/ci/scripts/apex_policy_check.py --ignore-empty $changed_files
          else
            python governance/ci/scripts/apex_policy_check.py
          fi

      - name: Emit JSON report (artifact)
        if: always()
        # || echo fallback ensures artifact upload never fails on report-gen error;
        # NOT a gate bypass — the gate already ran in the step above.
        run: |
          changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || git diff --name-only HEAD~1 HEAD)
          if [ -n "$changed_files" ]; then
            python governance/ci/scripts/apex_policy_check.py --json --ignore-empty $changed_files > apex-policy-report.json || echo '{"status":"report-generation-failed"}' > apex-policy-report.json
          else
            python governance/ci/scripts/apex_policy_check.py --json > apex-policy-report.json || echo '{"status":"report-generation-failed"}' > apex-policy-report.json
          fi

      - name: Upload policy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apex-policy-report
          path: apex-policy-report.json
          retention-days: 14

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .github/gitleaks.toml

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          OSV_VERSION="1.9.2"
          curl --proto =https -fSL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Run osv-scanner
        run: |
          # Fail-closed: OSV scanner findings now block the governance gate.
          # Pre-existing vulnerabilities must be remediated or added to the OSV ignore list.
          changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || git diff --name-only HEAD~1 HEAD)
          changed_lockfiles=""
          for f in $changed_files; do
            case "$f" in
              *package-lock.json|*pnpm-lock.yaml|*yarn.lock|*bun.lockb|*requirements.txt|*Pipfile.lock|*poetry.lock|*Cargo.lock|*go.sum|*Gemfile.lock)
                changed_lockfiles="$changed_lockfiles $f"
                ;;
            esac
          done
          
          if [ -n "$changed_lockfiles" ]; then
            for f in $changed_lockfiles; do
              if [ -f "$f" ]; then
                echo "Scanning $f..."
                osv-scanner --config .osv-scanner.toml --lockfile="$f"
              fi
            done
          else
            echo "No dependency manifests modified; skipping osv-scan."
          fi

  # NOTE: A CodeQL "sast" job was removed here — CodeQL's upload requires GitHub
  # Advanced Security, which is not enabled on this repo, so the job was a
  # structural no-op (always skipped → green) and was already excluded from the
  # governance-gate aggregation. SAST coverage remains active via SonarCloud
  # (ci-runtime-gates), ESLint security rules, and osv-scanner (dependency-audit).
  # Re-add a CodeQL job only after setting repository variable ENABLE_GHAS=true.

  rfc-architecture-marker:
    name: RFC + architecture review marker
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Enforce RFC link on architecture-impacting PRs
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # If any changed file matches architecture-impacting paths, require RFC link in PR body.
          if ! changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || git diff --name-only HEAD~1 HEAD); then
             echo "Failed to determine changed files."
             exit 1
          fi
          echo "Changed files:"
          echo "$changed"
          requires_rfc=0
          for f in $changed; do
            case "$f" in
              src/domains/*|src/services/*|src/workers/*|src/ai/*|db/*|infra/*|supabase/migrations/*|governance/doctrine/*)
                requires_rfc=1
                ;;
            esac
          done
          if [ "$requires_rfc" = "1" ]; then
            echo "Architecture-impacting changes detected. RFC evidence required."
            has_pr_rfc_marker=0
            if echo "$PR_BODY" | grep -Eqi 'RFC[- ]?link|omni-recall/rfc|/issues/[0-9]+|/pull/[0-9]+'; then
              has_pr_rfc_marker=1
            fi

            has_committed_rfc=0
            for f in $changed; do
              case "$f" in
                memory/omni-recall/rfc/*.md|memory/omni-recall/docs/**/RFC*.md|memory/omni-recall/docs/**/rfc-*.md)
                  # A committed RFC document is durable architecture-review evidence
                  # when the pull_request event body is stale or unavailable.
                  has_committed_rfc=1
                  ;;
              esac
            done

            if [ "$has_pr_rfc_marker" != "1" ] && [ "$has_committed_rfc" != "1" ]; then
              echo "::error::Missing RFC evidence for architecture-impacting change. Add an RFC link to the PR body or commit a memory/omni-recall/rfc document."
              exit 1
            fi
            echo "RFC evidence present."
          else
            echo "No architecture-impacting paths changed. Skipping RFC requirement."
          fi

  ose-token-contract:
    name: OmniSkin Engine token contract (OSE Guard)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Setup Bun

        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run OSE Guard
        run: npm run check:omni-skin

  governance-gate:
    name: Governance gate (required for branch protection)
    runs-on: ubuntu-22.04
    permissions: {}
    needs: [apex-policy, secret-scan, dependency-audit, rfc-architecture-marker, ose-token-contract]
    if: always()
    steps:
      - name: Aggregate result
        run: |
          if [ "${{ needs.apex-policy.result }}" != "success" ] || \
             [ "${{ needs.secret-scan.result }}" != "success" ] || \
             [ "${{ needs.dependency-audit.result }}" != "success" ] || \
             [ "${{ needs.rfc-architecture-marker.result }}" != "success" ] || \
             [ "${{ needs.ose-token-contract.result }}" != "success" ]; then
            echo "::error::APEX governance gate FAILED."
            echo "apex-policy: ${{ needs.apex-policy.result }}"
            echo "secret-scan: ${{ needs.secret-scan.result }}"
            echo "dependency-audit: ${{ needs.dependency-audit.result }}"
            echo "rfc-architecture-marker: ${{ needs.rfc-architecture-marker.result }}"
            echo "ose-token-contract: ${{ needs.ose-token-contract.result }}"
            exit 1
          fi
          echo "APEX governance gate passed."
