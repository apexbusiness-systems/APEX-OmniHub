# SECRET SCANNING WORKFLOW
# Prevents secrets from being committed to the repository
# Uses TruffleHog (primary, verified-only blocking) + Gitleaks (defence-in-depth)
#
# Dependency vulnerability auditing is intentionally NOT performed here — it is
# consolidated into security-regression-guard.yml (`dependency-audit` job), which
# owns the single canonical `npm audit --omit=dev --audit-level=high` gate plus the
# Python lockfile / security-floor checks. This workflow is secrets-only.

name: Secret Scanning

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  scan-secrets:
    name: Scan for Exposed Secrets
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history for comprehensive scan

      - name: Determine TruffleHog scan range
        id: trufflehog-range
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
            HEAD_REF="${{ github.event.pull_request.head.sha }}"
          else
            BASE_REF="${{ github.event.before }}"
            HEAD_REF="${{ github.sha }}"
          fi

          if [[ -z "${BASE_REF}" || "${BASE_REF}" == "0000000000000000000000000000000000000000" || "${BASE_REF}" == "${HEAD_REF}" ]]; then
            echo "use_range=false" >> "${GITHUB_OUTPUT}"
            echo "Using full repository secret scan (no valid commit range available)."
          else
            echo "use_range=true" >> "${GITHUB_OUTPUT}"
            echo "base_ref=${BASE_REF}" >> "${GITHUB_OUTPUT}"
            echo "head_ref=${HEAD_REF}" >> "${GITHUB_OUTPUT}"
            echo "Using incremental secret scan from ${BASE_REF} to ${HEAD_REF}."
          fi
      - name: Run TruffleHog scan (commit range)
        if: steps.trufflehog-range.outputs.use_range == 'true'
        uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26 # v3.95.2
        with:
          path: ./
          base: ${{ steps.trufflehog-range.outputs.base_ref }}
          head: ${{ steps.trufflehog-range.outputs.head_ref }}
          extra_args: --only-verified --exclude-paths .trufflehog-exclude-paths.txt

      - name: Run TruffleHog scan (full repository fallback)
        if: steps.trufflehog-range.outputs.use_range == 'false'
        uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26 # v3.95.2
        with:
          path: ./
          extra_args: --only-verified --exclude-paths .trufflehog-exclude-paths.txt

      - name: Scan with Gitleaks (backup scanner)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        # continue-on-error: gitleaks exits 1 on git revision-range errors (e.g.
        # when the PR base commit isn't reachable via --first-parent). TruffleHog
        # above is the primary blocking scanner; this step is defence-in-depth only.
        continue-on-error: true
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Optional: for Gitleaks Pro

  verify-no-env-files:
    name: Verify No .env Files
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for .env files
        run: |
          echo "Searching for .env files..."

          # Find all .env files (excluding .env.example)
          ENV_FILES=$(find . -type f -name ".env" ! -name ".env.example" ! -path "*/node_modules/*" ! -path "*/.git/*")

          if [ -n "$ENV_FILES" ]; then
            echo "❌ ERROR: Found .env files in repository:"
            echo "$ENV_FILES"
            echo ""
            echo "Please remove these files and add them to .gitignore"
            exit 1
          else
            echo "✅ No .env files found (excluding .env.example)"
          fi

      - name: Verify .env in .gitignore
        run: |
          echo "Checking .gitignore..."

          if ! grep -q "^\.env$" .gitignore; then
            echo "❌ ERROR: .env is not in .gitignore"
            echo "Please add '.env' to .gitignore"
            exit 1
          else
            echo "✅ .env is properly ignored"
          fi

  # NOTE: Two jobs were removed from this workflow and consolidated elsewhere:
  #   - "Verify Secrets Manager Usage": a warn-only regex grep that never gated;
  #     fully dominated by the blocking TruffleHog (verified-only) + Gitleaks
  #     scanners above. Deleted as pure noise.
  #   - "Scan Dependencies for Vulnerabilities" (Snyk informational + npm audit):
  #     dependency auditing is now owned solely by security-regression-guard.yml
  #     (`dependency-audit`), the single canonical npm/Python dependency gate.

  report:
    name: Security Report
    runs-on: ubuntu-22.04
    needs: [scan-secrets, verify-no-env-files]
    if: always()

    steps:
      - name: Generate Security Report
        run: |
          echo "## 🔒 Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check job results
          if [ "${{ needs.scan-secrets.result }}" == "success" ]; then
            echo "✅ **Secret Scanning:** PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Secret Scanning:** FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.verify-no-env-files.result }}" == "success" ]; then
            echo "✅ **.env File Check:** PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **.env File Check:** FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Review any failures above" >> $GITHUB_STEP_SUMMARY
          echo "- Remove any .env files and add to .gitignore" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency vulnerabilities are gated by Security Regression Guard" >> $GITHUB_STEP_SUMMARY
          echo "- Use Doppler for secrets management" >> $GITHUB_STEP_SUMMARY
