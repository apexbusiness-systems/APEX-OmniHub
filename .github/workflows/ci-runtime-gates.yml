name: CI Runtime Gates

on:
  push:
    branches: [main, master, chore/readiness-report-auto-update]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '15000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '60000'
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  architectural-boundary-enforcement:
    name: Architectural Boundary Enforcement
    runs-on: ubuntu-22.04
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Guardrail 0 - File Existence (Rename-Drift Closure)"
        run: |
          MONITORED_FILES=(
            "orchestrator/main.py"
            "services/orchestrator/api/routes.py"
            "orchestrator/metrics.py"
          )
          MISSING=0
          for f in "${MONITORED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "BOUNDARY VIOLATION: Monitored file '$f' is missing."
              echo "RULE: All boundary-monitored files must exist at their canonical paths. File renames silently bypass path-specific guardrails."
              echo "FIX: Restore '$f' to its canonical path, or update .github/workflows/ci-runtime-gates.yml to track the new location."
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi
          echo "BOUNDARY CLEAR: All 3 monitored files exist at canonical paths."

      - name: "Guardrail 1 - Worker Purity (main.py must not import HTTP servers)"
        run: |
          if grep -qE "^\s*(import|from)\s+(fastapi|uvicorn)\b" orchestrator/main.py; then
            echo "BOUNDARY VIOLATION: orchestrator/main.py contains an HTTP server import (fastapi or uvicorn)."
            echo "RULE: main.py is a pure Temporal Worker CLI entrypoint - no HTTP server imports permitted."
            echo "FIX: Remove all fastapi/uvicorn imports from main.py. Move HTTP logic to services/orchestrator/api/."
            exit 1
          else
            echo "BOUNDARY CLEAR: main.py worker purity confirmed - no fastapi/uvicorn imports."
          fi

      - name: "Guardrail 2 - API Purity (routes.py must not init Temporal Workers)"
        run: |
          if grep -qE "\.Worker\(|Worker\(|start_worker" services/orchestrator/api/routes.py; then
            echo "BOUNDARY VIOLATION: routes.py initializes or references a Temporal Worker."
            echo "RULE: API routes are HTTP client-only - Worker lifecycle belongs exclusively in orchestrator/main.py."
            echo "FIX: Remove Worker()/start_worker references. Use Temporal Client to dispatch workflows, not run Workers."
            exit 1
          else
            echo "BOUNDARY CLEAR: routes.py API purity confirmed - no Worker initialization."
          fi

      - name: "Guardrail 3 - Metrics Decoupling (metrics.py must not import API layer)"
        run: |
          if grep -qE "^\s*from\s+services\.orchestrator\.api\b" orchestrator/metrics.py; then
            echo "BOUNDARY VIOLATION: metrics.py imports from services.orchestrator.api."
            echo "RULE: The telemetry layer is a shared utility - it must not couple to the API layer."
            echo "FIX: Remove the services.orchestrator.api import. Pass any needed dependencies via function arguments."
            exit 1
          else
            echo "BOUNDARY CLEAR: metrics.py decoupling confirmed - no API layer imports."
          fi

      - name: "Guardrail 4 - OmniBoard Feed Drift Closure"
        run: |
          if grep -qE "OmniBoardFeed|rt_omniboard" apps/omnihub-site/dashboard/OmniDashShell.tsx 2>/dev/null; then
            echo "BOUNDARY VIOLATION: OmniDashShell.tsx contains references to OmniBoardFeed or rt_omniboard."
            echo "RULE: Antigravity 2.0 Directive strictly forbids the OmniBoardFeed widget. OmniBoard is exclusively a sidebar navigation gateway."
            echo "FIX: Remove the dead OmniBoardFeed code and its container."
            exit 1
          else
            echo "BOUNDARY CLEAR: OmniBoardFeed absence confirmed."
          fi

  terraform-expression-drift-gate:
    name: Terraform Expression Drift Gate
    needs: architectural-boundary-enforcement
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Terraform expression drift tests
        id: terraform_drift_tests
        continue-on-error: true # ci-integrity-allow: outcome captured; next step fails the gate via `exit 1` on failure
        run: npm run test:infra:coverage

      - name: Annotate Terraform expression drift failure
        if: steps.terraform_drift_tests.outcome == 'failure'
        run: |
          echo "::error title=Terraform Expression Drift Gate::Infra drift or coverage threshold failure detected. Run 'npm run test:infra:coverage' locally and update terraform/modules/cloudflare/main.tf, src/omnihub-gateway/TemporalBridge.ts, or related tests."
          exit 1

  build-and-test:
    needs: [architectural-boundary-enforcement, terraform-expression-drift-gate]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify changelog paths exist
        run: node scripts/verify-changelog-paths.js CHANGELOG.md

      - name: Doc-Path Guard (Phase 1)
        run: bash scripts/ci/check-doc-paths.sh

      - name: Test Integrity Doctrine - Banned fail() (R1)
        run: |
          if grep -rn "\.fail(" tests/ 2>/dev/null; then
            echo "::error::test.fail() is banned by APEX Test Integrity Doctrine (R1)."
            exit 1
          fi

      - name: Test Integrity Doctrine - Banned Placeholder Skips (R2)
        run: |
          if grep -rn "\.skip(" tests/ 2>/dev/null | grep -v "APEX-"; then
            echo "::error::Placeholder skips or TKT-000 are banned. All skips must carry an APEX-#### ticket (R2)."
            exit 1
          fi

      - name: Test Integrity Doctrine - Sentinels (R3)
        run: |
          if [ ! -d "tests/e2e-playwright/__sentinels__" ] || [ -z "$(ls -A tests/e2e-playwright/__sentinels__ 2>/dev/null)" ]; then
            echo "NO SENTINELS FOUND"
            exit 1
          fi

      - name: Repo Hygiene Guard
        run: bash scripts/repo-hygiene-guard.sh

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate Additive Migrations
        run: bun run scripts/ci/check-additive-migrations.ts

      - name: Agent destructive-action / hallucination guardrail
        run: node scripts/ci/guard-agent-destructive-actions.mjs

      - name: Edge function manifest drift guard
        run: node scripts/ci/check-edge-fn-manifest.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      # ── Folded from the retired Production Readiness Gate (production-readiness.yml).
      # These are the unique checks that workflow added on top of build-and-test;
      # they now live here so retiring it loses no coverage.
      - name: Documentation drift check
        run: npm run docs:check

      - name: Cloudflare Pages SPA redirect check
        run: test -f apps/omnihub-site/public/_redirects

      - name: Guardrail — no TS suppression in config files
        run: |
          if grep -r "@ts-ignore\|@ts-expect-error" vitest.config.ts vite.config.ts 2>/dev/null; then
            echo "::error::TS suppression comments found in config files"
            exit 1
          fi
          echo "✅ No TS suppression in config files"

      - name: Security posture check
        run: bash scripts/security/security-posture-check.sh

      - name: Cache Turborepo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: |
          # Only validate the checked-out HEAD commit. Historical PR commits can
          # be generated by automation or GitHub UI and cannot always be amended.
          ./node_modules/.bin/commitlint \
            --config ./commitlint.config.cjs \
            --last \
            --verbose

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Secret scan
        run: bun run secret:scan

      - name: React singleton check
        run: npm run check:react

      - name: Verify Python availability
        run: |
          python3 --version
          which python3

      - name: Clear Vitest cache
        run: |
          rm -rf node_modules/.vitest
          echo "Vitest cache cleared"

      - name: Run unit tests
        run: npm run test
        env:
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          REQUIRE_SUPABASE_INTEGRATION_TESTS: "false"

      - name: Run JS coverage
        run: npm run test:coverage

      - name: Run A.R.I.S.E. coverage (Phase 0 structural observatory)
        working-directory: apps/apex-arise
        run: bun run test:coverage
        continue-on-error: true # ci-integrity-allow: ARISE is measurement-only; coverage generation failure must not block the required Sonar gate

      - name: Verify coverage integrity (anti-silent-failure guard)
        run: npm run check:coverage-integrity


      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run orchestrator Python coverage
        run: cd orchestrator && pip install -r requirements.txt && pytest --cov=. --cov=../omega --cov-report=xml:coverage.xml

      - name: Run local-agents Python coverage
        # timeout-minutes guards against pip download stalls (large pandas wheel)
        # and hanging async tests.
        timeout-minutes: 8
        run: |
          cd local-agents
          pip install --timeout 60 --retries 2 --only-binary :all: -r requirements.txt
          pip install --timeout 60 --retries 2 --only-binary :all: pytest==8.3.5 pytest-cov==6.1.1 pytest-asyncio==0.26.0 pytest-timeout==2.4.0
          pytest test_benchmark_connector.py \
            --timeout=30 \
            --cov=benchmark_connector \
            --cov-report=xml:coverage.xml \
            || true  # ci-integrity-allow: coverage generation over failure


      - name: Select Java 21 for SonarCloud Scan
        if: vars.SONAR_CI_SCAN_ENABLED != 'false' && env.SONAR_TOKEN != ''
        # SONAR_SCANNER_JAVA_EXE_PATH (sonar.scanner.javaExePath) is read by the
        # scanner bootstrapper itself, so it survives the scan action's internal
        # JAVA_HOME override to its bundled Java 17 JRE — which SonarQube Cloud
        # rejects since the 2026-07-20 Java<21 cutoff.
        run: |
          echo "SONAR_SCANNER_JAVA_EXE_PATH=$JAVA_HOME_21_X64/bin/java" >> "$GITHUB_ENV"

      - name: SonarCloud Scan
        if: vars.SONAR_CI_SCAN_ENABLED != 'false' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run OmniEval (deterministic eval gate)
        run: npm run eval:ci

      - name: Run Armageddon CI certification evidence
        run: bun run armageddon:certify:ci
        env:
          SIM_MODE: "true"

      - name: Upload Armageddon evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: armageddon-evidence
          path: artifacts/armageddon/latest.json
          retention-days: 30

      - name: Upload OmniEval report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: omnieval-report
          path: artifacts/evals/report.json
          retention-days: 30

      - name: Cloudflare Pages Production Sync Shield
        run: |
          test ! -f wrangler.toml
          npm run check:cloudflare-parity
          npm run build
          bun run verify:cloudflare-pages-contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-key
          VITE_SUPABASE_PUBLISHABLE_KEY: test-key

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          VITE_CONNECT_AI_ENABLED: 'true'

      - name: PWA source + dist integrity guard
        run: npm run check:pwa

      - name: OmniDash canonical layout + integrity guard
        run: npm run check:omnidash

      # Folded from the retired Production Readiness Gate: the SSG bundle build is
      # a distinct artifact (apps/omnihub-site) not produced by the root build above.
      - name: Build SSG bundle (apps/omnihub-site)
        working-directory: apps/omnihub-site
        run: |
          bun install --frozen-lockfile
          bun run build:ssg

      - name: Bundle size check
        run: |
          npm exec --no --ignore-scripts -- size-limit --json > bundle-size.json || {
            echo "::error::Bundle size exceeds limits. Run 'npm run bundle:analyze' locally."
            cat bundle-size.json
            exit 1
          }
          echo "Bundle size within limits"

      - name: Upload bundle stats
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bundle-stats
          path: |
            dist/stats.html
            bundle-size.json
          retention-days: 30

      - name: Attest production bundle provenance
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2
        continue-on-error: true # ci-integrity-allow: bypass transient sigstore/rekor network timeouts
        with:
          subject-path: dist/**

      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        timeout-minutes: 20
        run: |
          # E2E runs against the runner's preinstalled Google Chrome via
          # Playwright's `channel: 'chrome'` (see playwright.config.ts). This
          # avoids the bundled-Chromium CDN download, which reliably hangs after
          # reaching 100% on CI runners. Install Chrome via apt (dl.google.com)
          # only if it is not already present, plus the shared OS libraries.
          ./node_modules/.bin/playwright install-deps chromium
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then
            ./node_modules/.bin/playwright install chrome
          fi
          google-chrome --version 2>/dev/null || google-chrome-stable --version

      - name: Start preview server
        run: |
          npm run preview -- --host --port 4173 &
          echo $! > preview.pid
          node -e "const url='http://localhost:4173';let n=0;(async function poll(){try{const r=await fetch(url);if(r.ok||r.status<500)process.exit(0)}catch{} if(++n>60)process.exit(1); setTimeout(poll,500)})()"

      - name: Run asset access tests
        run: npm run test:assets
        env:
          BASE_URL: http://localhost:4173

      - name: Supabase environment alignment inventory (non-blocking)
        run: node scripts/ci/verify-supabase-env-alignment.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}

      - name: Run Playwright render tests (render-smoke mode — no backend required)
        # Render-smoke mode: global-setup skips the Supabase healthcheck and
        # backend-dependent specs self-skip with BLOCKED(APEX-1207) trackers, so
        # this gate validates UI rendering against the local preview build and is
        # NOT blocked by E2E Supabase reachability. The full Test Integrity
        # Doctrine R4 suite runs separately via `npm run test:e2e:backend`
        # (APEX_E2E_BACKEND_REQUIRED=true) once the live E2E project is restored.
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:4173
          APEX_E2E_BACKEND_REQUIRED: 'false'
          # Match build-time VITE_SUPABASE_URL so stub-session storage keys align.
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then
            kill $(cat preview.pid) || true # ci-integrity-allow: best-effort cleanup of preview server pid
            rm preview.pid
          fi

      - name: Scan for Guard Rail Violations
        if: always()
        run: |
          mkdir -p logs
          if grep -rqE "GUARD_RAIL_VIOLATION|policy breach|tri-force violation" logs/ 2>/dev/null; then
            echo "GUARD_RAIL_VIOLATION_DETECTED=true" >> "$GITHUB_ENV"
            echo "::error::Guard rail violation detected in logs"
            exit 1
          fi
          echo "No guard rail violations detected"

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Setup k6
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          k6-version: '1.3.0'

      - name: Run K6 Performance Tests (SOFT gate / p99<800ms)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        # ci-integrity-allow: intentional SOFT gate — K6 perf smoke is advisory (p99<800ms target). A perf-smoke blip must not block the release; regressions are reviewed from the uploaded performance-summary evidence, not by failing the gate.
        continue-on-error: true
        run: npm run perf:k6:smoke

      - name: Upload performance evidence
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # ci-integrity-allow: non-blocking evidence upload — paired with the SOFT K6 gate above. A transient artifact-upload failure (or absent summary; if-no-files-found:ignore) must not fail the required gate after tests have already passed.
        continue-on-error: true
        with:
          name: performance-summary
          path: artifacts/production-validation/performance-summary.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7
