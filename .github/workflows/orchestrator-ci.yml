name: Orchestrator CI

on:
  push:
    branches: [main, develop, "claude/**"]
    paths:
      - "orchestrator/**"
      - ".github/workflows/orchestrator-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "orchestrator/**"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 15



    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start Redis Stack (Resilient Pull)
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull redis/redis-stack-server:7.2.0-v9 && break || { echo "Pull failed, retrying in 15s..."; sleep 15; }
          done
          docker run -d -p 6379:6379 --name redis redis/redis-stack-server:7.2.0-v9
          for i in {1..30}; do
            docker exec redis redis-cli ping | grep -q PONG && break || sleep 1
          done

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "orchestrator/pyproject.toml"

      - name: Install dependencies
        working-directory: orchestrator
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linters
        working-directory: orchestrator
        run: |
          python -m ruff check . && python -m ruff format --check .

      - name: Check portability guardrails
        run: |
          # Fail if any Supabase SDK imports appear in orchestrator/activities
          if grep -r "from supabase\|create_client\|supabase\." orchestrator/activities/ --include="*.py" | grep -v "__pycache__"; then
            echo "❌ FAILED: Direct Supabase SDK usage found in orchestrator/activities/"
            echo "All database operations must use the provider interface."
            exit 1
          else
            echo "✅ PASSED: No direct Supabase SDK usage in activities"
          fi

      - name: Check for stubbed provider implementations
        run: |
          python scripts/ci/assert_no_stubbed_provider_impls.py

      - name: Run type checker
        working-directory: orchestrator
        run: |
          # Strict mode tracks pre-existing errors across third-party stubs.
          # Run strict as informational; enforce basic type safety as blocking.
          mypy --strict models/ infrastructure/ workflows/ activities/ config.py main.py || true # ci-integrity-allow: informational strict pass; blocking type safety enforced by the mypy run below
          mypy --config-file /dev/null --ignore-missing-imports --follow-imports=silent models/ infrastructure/ workflows/ activities/ config.py main.py

      - name: Run tests with coverage
        working-directory: orchestrator
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: test-key
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:54322/postgres
          REDIS_URL: redis://localhost:6379
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=55

      - name: Upload coverage
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: ./orchestrator/coverage.xml
          flags: orchestrator
          name: orchestrator-coverage

  security:
    name: Security Scan
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: orchestrator
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run safety check
        working-directory: orchestrator
        run: |
          pip install -e .
          # safety 3.x: --severity and --save-json flags do not exist.
          # Capture JSON to file; non-zero exit means vulnerabilities found.
          # --ignore 86338: CVE-2025-69872 diskcache pickle deserialization —
          #   transitive dep from instructor, no fixed version exists (<=5.6.3),
          #   only exploitable if attacker can write to on-disk cache directory.
          # --ignore SFTY-20250331-30014: CVE-2025-3000 torch.jit.script memory
          #   corruption — affects every torch release (<=2.12.0, the latest);
          #   no fixed version exists. Exploitation requires running a crafted
          #   script on the local host (arbitrary code execution already), and
          #   the orchestrator never feeds untrusted input to torch.jit.script.
          safety check --output json --ignore 86338 --ignore SFTY-20250331-30014 > safety-report.json 2>&1 || {
            echo "::error::Safety found vulnerabilities in Python dependencies — see safety-report artifact."
            cat safety-report.json
            exit 1
          }

      - name: Upload safety results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safety-report
          path: orchestrator/safety-report.json

      - name: Run bandit security scan
        working-directory: orchestrator
        run: |
          # -ll = report MEDIUM and HIGH severity findings only.
          # Allow bandit to exit non-zero (findings exist) so the Python
          # filter below can decide whether to block on HIGH severity only.
          bandit -r . -ll -f json -o bandit-report.json || true # ci-integrity-allow: report captured; HIGH-severity findings block via the filter below
          # Fail CI when any HIGH severity finding is present.
          python -c "
          import json, sys
          with open('bandit-report.json') as f:
              report = json.load(f)
          highs = [r for r in report.get('results', []) if r.get('issue_severity') == 'HIGH']
          if highs:
              print(f'BLOCKED: {len(highs)} HIGH severity bandit finding(s):')
              for h in highs:
                  print(f\"  [{h['issue_severity']}] {h['issue_text']} @ {h['filename']}:{h['line_number']}\")
              sys.exit(1)
          print(f'Bandit: no HIGH severity findings.')
          "

      - name: Upload bandit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: orchestrator/bandit-report.json

  build:
    name: Build Docker Image
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # No buildx setup: the build below uses plain `docker build`, which runs on the
      # runner's default Docker daemon (BuildKit is built in). The buildx container
      # driver pulls moby/buildkit:buildx-stable-1 from Docker Hub on boot, which
      # intermittently fails the registry HEAD (anonymous rate limit) and adds no value
      # here since we never call `docker buildx build`.
      - name: Build Docker image
        working-directory: orchestrator
        run: |
          DOCKER_BUILDKIT=1 docker build -t apex-orchestrator:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run --rm apex-orchestrator:${{ github.sha }} python -c "print('Docker build successful')"
