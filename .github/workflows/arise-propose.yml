name: "A.R.I.S.E. Propose Engine (Phase 1b)"

# Human-initiated only for this contract. Not on push, not on pull_request,
# not on a schedule — that unlock is earned after a track record, matching
# the Phase 0 -> 1 -> 2 gating discipline in the Consolidated Plan.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: arise-propose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  propose:
    name: "A.R.I.S.E. Propose"
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    continue-on-error: true
    outputs:
      patch_ready: ${{ steps.run_propose.outputs.patch_ready }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Root deps (ai, @ai-sdk/anthropic, zod) are resolved by apps/apex-arise
      # via Bun's ancestor node_modules lookup — no new package.json entry.
      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Install root dependencies
        run: bun install --frozen-lockfile
        continue-on-error: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install A.R.I.S.E. dependencies
        run: cd apps/apex-arise && bun install
        continue-on-error: true

      - name: Run propose engine
        id: run_propose
        run: cd apps/apex-arise && bun run arise:propose
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload propose report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arise-propose-report
          path: memory/omni-recall/docs/CURRENT_ARISE_PROPOSE_REPORT_*.md
          if-no-files-found: ignore
          retention-days: 90

      # Only present when the model's diff passed both the envelope check
      # and the isolated sandbox verification; if-no-files-found:ignore
      # covers every rejection/failure outcome cleanly.
      - name: Upload candidate diff artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arise-propose-candidate
          path: apps/apex-arise/artifacts/propose/**
          if-no-files-found: ignore
          retention-days: 7

  open-pr:
    name: "A.R.I.S.E. Open Proposal PR"
    needs: propose
    # Only runs when the propose job actually produced a validated diff.
    # Never runs in the same job as the model call or the sandbox — this is
    # the only job in this workflow that ever holds a write-scoped token.
    if: needs.propose.outputs.patch_ready == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install A.R.I.S.E. dependencies
        run: cd apps/apex-arise && bun install
        continue-on-error: true

      - name: Download candidate diff artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: arise-propose-candidate
          path: apps/apex-arise/artifacts/propose

      - name: Open proposal PR
        run: cd apps/apex-arise && bun run arise:open-pr
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
