name: Deploy Web3 Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  deploy-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      # Supabase CLI analytics is nonessential in CI and can fail successful
      # commands during PostHog shutdown when the telemetry endpoint is slow.
      SUPABASE_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1
        with:
          version: latest

      - name: Link to Supabase
        # Ensures the CLI knows which project to target for subsequent commands
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref $SUPABASE_PROJECT_REF

      - name: Repair Migration History
        # Fix: Mark old migration as reverted after file rename
        # The migration was renamed from 20260109 to 20260109120000 to avoid version collision
        # Fix: 20260226000001 exists in remote schema_migrations but db push re-attempts INSERT
        # (duplicate key). Revert clears the stale entry; db push re-inserts cleanly via empty file.
        # Fix (OmniMedia): 20260628005132 / 20260629010526 were applied to remote under dev-time
        # timestamps, then committed under the canonical names 20260628000000_omnimedia_pipeline.sql
        # and 20260629120000_omnimedia_images_and_caps.sql. The stale remote rows have no local
        # files, so `db push --include-all` aborts ("remote migration versions not found in local
        # migrations directory"). Reverting clears the stale bookkeeping; the canonical files are
        # additive + idempotent ("safe to run multiple times"), so db push re-applies them cleanly.
        run: |
          supabase migration repair --status reverted 20260109 || echo "Migration 20260109 already handled or does not exist"
          supabase migration repair --status reverted 20260226000001 || echo "Migration 20260226000001 already handled or does not exist"
          supabase migration repair --status reverted 20260623074530 || echo "Migration 20260623074530 already handled or does not exist"
          supabase migration repair --status reverted 20260628005132 || echo "Migration 20260628005132 already handled or does not exist"
          supabase migration repair --status reverted 20260629010526 || echo "Migration 20260629010526 already handled or does not exist"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Apply Database Migrations
        # Critical: Deploys schema changes (e.g., 'emergency_controls' table) BEFORE functions
        # fix: Removes invalid 'desc' key
        run: supabase db push --include-all --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy Edge Functions
        # fix: Fixed broken env indentation and formatting
        run: |
          supabase functions deploy web3-nonce
          supabase functions deploy web3-verify
          supabase functions deploy alchemy-webhook
          supabase functions deploy verify-nft
          supabase functions deploy platform-health
          supabase functions deploy omnilink-port
          supabase functions deploy create-billing-portal
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Edge Functions Deployment" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Status:** Success" >> $GITHUB_STEP_SUMMARY
            echo "All functions and migrations applied successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Failed" >> $GITHUB_STEP_SUMMARY
            echo "Check logs for details on migration or deployment errors." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Test Function Health
        if: success()
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          # --- Configuration ---
          MAX_RETRIES=3
          RETRY_DELAY=5
          # ---------------------

          # 1. Validate Secrets
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::Missing required secret: SUPABASE_PROJECT_REF"
            exit 1
          fi

          # 2. Select Auth Token (Prefer Anon, Fallback to Service Role)
          AUTH_JWT="${SUPABASE_ANON_KEY:-}"
          if [ -z "${AUTH_JWT}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "⚠️ SUPABASE_ANON_KEY missing. Falling back to SERVICE_ROLE_KEY."
            AUTH_JWT="${SUPABASE_SERVICE_ROLE_KEY}"
          fi

          if [ -z "${AUTH_JWT}" ]; then
            echo "::error::No JWT available. Set SUPABASE_ANON_KEY or SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi

          # 3. Construct URL
          FUNCTIONS_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          URL="${FUNCTIONS_URL}/platform-health"

          echo "Testing endpoint: ${URL}"

          # 4. Retry Logic Loop
          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "Attempt $i/$MAX_RETRIES..."

            HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/response.json \
              -H "apikey: ${AUTH_JWT}" \
              -H "Authorization: Bearer ${AUTH_JWT}" \
              -H "Content-Type: application/json" \
              "${URL}")

            if [ "${HTTP_CODE}" == "200" ]; then
              echo "✅ Healthcheck passed (HTTP 200)"
              cat /tmp/response.json || true # ci-integrity-allow: informational response body logging only
              exit 0
            else
              echo "⚠️ Attempt $i failed with HTTP ${HTTP_CODE}"
              cat /tmp/response.json || true # ci-integrity-allow: informational response body logging only
              echo ""

              if [ $i -lt $MAX_RETRIES ]; then
                sleep $RETRY_DELAY
              fi
            fi
          done

          # 5. Final Failure
          echo "::error::Healthcheck failed after ${MAX_RETRIES} attempts."
          exit 1
