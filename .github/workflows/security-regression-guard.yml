# Security Regression Guard
# Prevents security vulnerabilities from being reintroduced
#
# This workflow enforces security invariants that must never regress:
# 1. No wildcard CORS in edge functions
# 2. No hardcoded credentials
# 3. No in-memory-only rate limiting in serverless
# 4. No SQL injection vulnerabilities
# 5. No known CVEs in dependencies

name: Security Regression Guard

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

# Job-level permissions (preferred over workflow-level per SonarQube S6770)

jobs:
  security-invariants:
    name: Security Invariant Checks
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ github.token }}

      - name: Check for wildcard CORS
        run: |
          echo "Checking for wildcard CORS in edge functions..."
          if grep -rn "Access-Control-Allow-Origin.*'\*'" supabase/functions/ --include="*.ts" 2>/dev/null | grep -v "_shared/cors.ts"; then
            echo "::error::Wildcard CORS detected in edge functions. Use _shared/cors.ts instead."
            exit 1
          fi
          echo "✅ No wildcard CORS found"

      - name: Check for hardcoded credentials
        run: |
          echo "Checking for hardcoded credentials..."
          # Check docker-compose for hardcoded passwords
          if grep -E "(POSTGRES_PASSWORD|PASSWORD):\s*[a-zA-Z0-9_-]+$" orchestrator/docker-compose.yml 2>/dev/null | grep -v '\${'; then
            echo "::error::Hardcoded credentials detected in docker-compose.yml"
            exit 1
          fi
          echo "✅ No hardcoded credentials found"

      - name: Check for in-memory rate limiting
        run: |
          echo "Checking for unsafe in-memory rate limiting..."
          # Check for Map-based rate limiting without distributed fallback
          UNSAFE_RATELIMIT=$(grep -rn "new Map.*rate" supabase/functions/ --include="*.ts" 2>/dev/null | grep -v "_shared/ratelimit.ts" | wc -l)
          if [ "$UNSAFE_RATELIMIT" -gt 0 ]; then
            echo "::warning::In-memory rate limiting detected. Consider using _shared/ratelimit.ts for distributed rate limiting."
          fi
          echo "✅ Rate limiting check complete"

      - name: Check for SQL injection patterns
        run: |
          echo "Checking for SQL injection vulnerabilities..."
          # Check Python files for unvalidated table names
          if grep -rn "\.table(" orchestrator/ --include="*.py" 2>/dev/null | grep -v "validate_table_name"; then
            echo "::warning::Direct table access detected. Ensure validate_table_name() is used."
          fi
          echo "✅ SQL injection check complete"

      - name: Check for unencrypted Terraform state
        run: |
          echo "Checking Terraform backend configuration..."
          if grep -rn 'backend "local"' terraform/ --include="*.tf" 2>/dev/null | grep -v "^#"; then
            echo "::error::Local Terraform backend detected in non-development environment"
            exit 1
          fi
          echo "✅ Terraform backend check complete"

      - name: Supabase migration version uniqueness
        run: |
          echo "Checking for duplicate Supabase migration version prefixes..."
          node scripts/ci/check-supabase-migration-versions.mjs

      - name: Forbidden platform regressions (defensive invariants)
        run: |
          echo "Enforcing platform invariants that must never regress..."
          fail=0
          if [ -f wrangler.toml ]; then
            echo "::error::Root-level wrangler.toml is forbidden (use per-app wrangler configs)."
            fail=1
          fi
          # Anchored to the real YAML mapping line so detection strings don't self-match.
          if grep -rnE '^[[:space:]]*bun-version:[[:space:]]+latest[[:space:]]*$' .github/workflows/ 2>/dev/null; then
            echo "::error::Floating 'bun-version: latest' detected. Pin an exact Bun version."
            fail=1
          fi
          # Nested override == an overrides/resolutions entry whose value is an object.
          nested=$(node -e '
            const p=require("./package.json");const bad=[];
            for(const sec of ["overrides","resolutions"]){const o=p[sec]||{};
              for(const[k,v]of Object.entries(o)) if(v&&typeof v==="object") bad.push(sec+"."+k);}
            if(bad.length){console.log(bad.join(", "));process.exitCode=0;}' 2>/dev/null)
          if [ -n "$nested" ]; then
            echo "::error::Bun-unsupported nested override(s) in package.json: ${nested}. Use flat overrides."
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "✅ Platform invariants hold" || exit 1

      - name: Release certification authority regression guard
        run: |
          echo "Checking for stale release certification authority docs..."
          node scripts/ci/check-release-certification-docs.mjs

      - name: Block DEV BYPASS markers
        run: |
          # Folded in from the retired security-guards.yml workflow.
          if grep -r "DEV BYPASS" apps/omnihub-site/ 2>/dev/null; then
            echo "::error::DEV BYPASS marker found in apps/omnihub-site/ — remove before merge."
            exit 1
          fi
          echo "✅ No DEV BYPASS markers found"

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'

      - name: Setup Bun

        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::bun install --frozen-lockfile failed after 3 attempts; dependency audit cannot proceed."
              exit 1
            fi
            echo "bun install --frozen-lockfile failed on attempt $attempt; verifying cache and retrying after transient network backoff..."
            if ! bun pm cache; then
              echo "bun pm cache failed; continuing because bun install --frozen-lockfile retry is authoritative."
            fi
            sleep $((attempt * 20))
          done

      - name: Run npm audit
        run: |
          node scripts/ci/check-dependency-audit.mjs

      - name: Check Python lockfile exists and is valid
        run: |
          if [ ! -f orchestrator/requirements.lock ]; then
            echo "::error::Python lockfile missing. Run 'pip-compile -o requirements.lock requirements.in' in orchestrator/"
            exit 1
          fi
          echo "Lockfile exists. Checking for denylisted distro packages..."
          if grep -iE "dbus-python|python-apt|PyGObject|launchpadlib" orchestrator/requirements.lock; then
            echo "::error::Lockfile contains OS distro packages. Regenerate with: cd orchestrator && pip-compile -o requirements.lock requirements.in"
            exit 1
          fi
          echo "Lockfile is clean."

      - name: Python dependency security floors and lock consistency
        run: |
          echo "Enforcing Python security floors (aiohttp >= patched) and lock parity..."
          python3 scripts/ci/check-python-dependency-security.py

  # NOTE: The "Code Quality Gates" job (tsc + tests + build) was removed here.
  # It exactly duplicated the canonical build-and-test job in ci-runtime-gates.yml
  # (TypeScript type check, unit tests, production build). This workflow is now
  # scoped to security invariants + dependency auditing only; build/test/typecheck
  # live solely in CI Runtime Gates.
