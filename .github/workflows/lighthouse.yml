name: Lighthouse CI

# On PR/push: accessibility + best-practices are BLOCKING (.lighthouserc.json).
# Nightly (schedule): full advisory audit incl. Performance + SEO
# (.lighthouserc.nightly.json) — reports regressions without blocking.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CONNECT_AI_ENABLED: 'true'

      - name: Run Lighthouse CI
        run: |
          # Nightly runs the full advisory audit (perf + seo); PR/push runs the
          # strict blocking config (accessibility + best-practices).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            CONFIG=.lighthouserc.nightly.json
          else
            CONFIG=.lighthouserc.json
          fi
          echo "Using Lighthouse config: $CONFIG"
          npm exec --no --ignore-scripts -- lhci autorun --config="$CONFIG"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30
