name: "A.R.I.S.E. Structural Observatory (Phase 0/1a)"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: arise-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-observatory:
    name: "A.R.I.S.E. Structural Observatory"
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install A.R.I.S.E. dependencies
        run: cd apps/apex-arise && bun install
        continue-on-error: true

      - name: Run structural quality scan
        run: cd apps/apex-arise && bun run arise:scan
        continue-on-error: true

      # Runner filesystem is destroyed when the job ends. Hand the dated
      # snapshot to the publish job via an artifact so it can be committed
      # back to the repo — without ever exposing a write-scoped token to
      # this job, which executes third-party scan tooling.
      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arise-structural-baseline
          path: memory/omni-recall/docs/CURRENT_ARISE_STRUCTURAL_BASELINE_*.md
          if-no-files-found: ignore
          retention-days: 90

  diagnosis-observatory:
    name: "A.R.I.S.E. Diagnosis Observatory"
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install A.R.I.S.E. dependencies
        run: cd apps/apex-arise && bun install
        continue-on-error: true

      - name: Run diagnosis scan
        run: cd apps/apex-arise && bun run arise:diagnose
        continue-on-error: true

      # Same rationale as structural-observatory above: hand the dated
      # report to the publish job via an artifact rather than exposing a
      # write-scoped token to the job that runs the diagnosis tooling.
      - name: Upload diagnosis report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arise-diagnosis-report
          path: memory/omni-recall/docs/CURRENT_ARISE_DIAGNOSIS_REPORT_*.md
          if-no-files-found: ignore
          retention-days: 90

  publish-snapshot:
    name: "Publish dated snapshot rolling PR"
    needs: [structural-observatory, diagnosis-observatory]
    # Protected branches reject direct pushes. Publish generated snapshots by
    # updating one rolling pull request so branch protection and required checks
    # remain authoritative without creating one new PR per push.
    if: |
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # Each artifact is downloaded independently, and a missing artifact
      # (e.g. its producing job failed before writing a report) must not
      # block publishing whichever artifact did succeed.
      - name: Download snapshot artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: arise-structural-baseline
          path: memory/omni-recall/docs

      - name: Download diagnosis report artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: arise-diagnosis-report
          path: memory/omni-recall/docs

      - name: Commit dated snapshot and diagnosis report to rolling PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(memory/omni-recall/docs/CURRENT_ARISE_STRUCTURAL_BASELINE_*.md memory/omni-recall/docs/CURRENT_ARISE_DIAGNOSIS_REPORT_*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No snapshot or diagnosis files found on disk to publish."
            exit 0
          fi
          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "No snapshot or diagnosis changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="automation/arise-snapshot-current"
          case "$branch" in
            main|master|refs/heads/main|refs/heads/master|origin/main|origin/master)
              echo "Refusing to publish A.R.I.S.E. snapshots to protected branch target: $branch" >&2
              exit 1
              ;;
            automation/arise-snapshot-current) ;;
            *)
              echo "Refusing to publish A.R.I.S.E. snapshots to unexpected branch target: $branch" >&2
              exit 1
              ;;
          esac

          workdir="$(mktemp -d)"
          cp "${files[@]}" "$workdir/"
          # Remove the untracked generated copies before switching branches:
          # the rolling branch already tracks same-dated snapshot filenames on
          # repeat runs of the same day, and git refuses to overwrite untracked
          # working-tree files on checkout ("would be overwritten by checkout").
          # The fresh content is restored from "$workdir" after the switch.
          rm -f "${files[@]}"
          git checkout -B "$branch" "origin/${{ github.ref_name }}"
          cp "$workdir"/* memory/omni-recall/docs/
          rm -rf "$workdir"

          files=(memory/omni-recall/docs/CURRENT_ARISE_STRUCTURAL_BASELINE_*.md memory/omni-recall/docs/CURRENT_ARISE_DIAGNOSIS_REPORT_*.md)
          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "No snapshot or diagnosis changes to publish after switching to rolling branch."
            exit 0
          fi
          git add "${files[@]}"
          git commit -m "chore(arise): publish structural baseline snapshot and diagnosis report"
          git push origin "HEAD:refs/heads/$branch" --force

          existing_pr_url="$(gh pr list --state open --base "${{ github.ref_name }}" --head "$branch" --json url --jq '.[0].url // empty')"
          if [ -n "$existing_pr_url" ]; then
            echo "Updated existing A.R.I.S.E. snapshot PR: $existing_pr_url"
            exit 0
          fi
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$branch" \
            --title "chore(arise): publish structural baseline snapshot" \
            --body "Automated A.R.I.S.E. snapshot publication. This rolling pull request is updated by subsequent A.R.I.S.E. runs to avoid duplicate snapshot PRs while preserving protected-branch checks."
